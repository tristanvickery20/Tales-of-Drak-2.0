<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tales of Drak Hotbar</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f6f2;font-family:Georgia,'Times New Roman',serif}.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:10px 10px calc(24px + env(safe-area-inset-bottom))}.bar{position:relative;width:min(98vw,1500px);aspect-ratio:500/159;filter:drop-shadow(0 10px 16px #0008)}.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.slot{position:absolute;border:0;background:transparent;padding:0;margin:0;overflow:visible;-webkit-tap-highlight-color:transparent}.slot.debug{background:rgba(255,0,0,.14);outline:1px solid rgba(255,0,0,.65)}.flash{position:absolute;inset:-9%;border:2px solid rgba(255,70,70,.98);box-shadow:0 0 9px rgba(255,48,48,.95),0 0 20px rgba(255,0,0,.62),inset 0 0 7px rgba(255,70,70,.35);opacity:0;pointer-events:none}.slot.active .flash{animation:flash .28s ease-out forwards}@keyframes flash{0%{opacity:1;filter:brightness(1.6)}100%{opacity:0;filter:brightness(1)}}.cooldown{position:absolute;inset:0 0 auto 0;height:0;background:rgba(0,0,0,.68);box-shadow:inset 0 0 14px #000;transition:height 2.4s linear;pointer-events:none}.key{position:absolute;left:0;right:0;top:-54%;text-align:center;color:#e8ded0;font-size:clamp(11px,3.2vw,19px);line-height:1;text-shadow:0 2px 2px #000,0 0 6px #000;letter-spacing:.04em;pointer-events:none}.count{position:absolute;right:3%;bottom:0;color:#f4edde;font:bold clamp(10px,3vw,17px) Georgia,'Times New Roman',serif;text-shadow:0 2px 2px #000,0 0 5px #000;pointer-events:none}.econ{position:absolute;z-index:7;color:#e8ded0;text-align:center;text-shadow:0 2px 2px #000,0 0 6px #000;letter-spacing:.035em;font-size:clamp(9px,2.4vw,16px);line-height:1;pointer-events:none}.action{left:13%;top:76%;width:12%}.bonus{left:31%;top:76%;width:12%}.reaction{left:58%;top:76%;width:14%}.move{left:75%;top:76%;width:11%}.pips{position:absolute;left:0;right:0;top:120%;display:flex;gap:clamp(3px,1.2vw,8px);justify-content:center}.pip{width:clamp(6px,1.9vw,11px);height:clamp(6px,1.9vw,11px);transform:rotate(45deg);border:1px solid rgba(255,232,206,.85);box-shadow:0 0 6px rgba(255,30,30,.55);background:#b91520}.bonus .pip{background:#333;box-shadow:none;border-color:#777}.move .pip{background:#d6a34a;box-shadow:0 0 6px rgba(214,163,74,.62)}.follow{position:absolute;left:101%;top:55%;width:8.7%;height:25%;background:linear-gradient(#111,#030303);border:2px solid #080808;box-shadow:inset 0 0 0 1px rgba(178,166,156,.38),0 0 8px #000;color:#e8ded0;text-shadow:0 2px 2px #000;font-size:clamp(7px,1vw,13px);text-align:center;padding-top:13%}.follow:before,.follow:after{content:"";position:absolute;left:14%;top:32%;width:32%;height:5%;background:#c4bbb0;transform:rotate(27deg);box-shadow:0 0 5px rgba(255,255,255,.3)}.follow:after{top:51%}.fkey{position:absolute;right:7%;top:12%;width:24%;height:38%;border:1px solid rgba(232,222,208,.6);line-height:1.35;background:#060606}.mode{position:absolute;left:42%;right:42%;top:91%;z-index:8;color:#d9cbb8;text-align:center;text-shadow:0 2px 2px #000;font-size:clamp(7px,1.8vw,12px);pointer-events:none}.tools{position:fixed;top:10px;left:10px;z-index:5;display:flex;gap:8px}.tools button{background:rgba(10,10,10,.8);color:#fff;border:1px solid #444;border-radius:6px;padding:8px 10px;font:12px system-ui}@media(max-width:700px){.bar{width:155vw;max-width:none}.tools{display:none}.follow{display:none}}</style></head><body><div class="stage"><div id="bar" class="bar"><img id="shell" class="shell" alt="Tales of Drak hotbar shell"><div id="mode" class="mode">Combat Hotbar</div><div class="econ action">ACTION<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="econ bonus">BONUS<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="econ reaction">REACTION<div class="pips"><i class="pip"></i></div></div><div class="econ move">MOVE<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="follow"><span class="fkey">F</span>Follow</div></div></div><div class="tools"><button id="debug">Debug hitboxes</button><button id="modeBtn">Toggle Tool/Combat</button></div><script>fetch('frame.b64?v=e6f7764').then(r=>r.text()).then(t=>shell.src='data:image/png;base64,'+t.trim()).catch(()=>{document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Hotbar frame failed to load.</p>')});const topKeys=['1','2','3','4','5','6','7','8','9','0','-','=',''];const bottomKeys=['Q','E','R','T','Y','U','I','O','P','[',']','-',''];const rects=[[13,21,31,31],[50,21,31,31],[87,21,31,31],[124,21,32,31],[162,21,32,31],[200,21,32,31],[238,21,32,31],[276,21,31,31],[313,21,31,31],[351,21,32,31],[389,21,32,31],[426,21,29,31],[461,21,26,31],[13,69,31,31],[50,69,31,31],[87,69,31,31],[124,69,32,31],[162,69,32,31],[200,69,32,31],[238,69,32,31],[276,69,31,31],[313,69,31,31],[351,69,32,31],[389,69,32,31],[426,69,29,31],[461,69,26,31]],counts={10:12,11:8,22:3,23:2},bar=document.getElementById('bar'),buttons=[];rects.forEach((r,i)=>{let b=document.createElement('button');b.className='slot';b.dataset.index=i;b.dataset.key=i<13?topKeys[i]:bottomKeys[i-13];b.style.left=r[0]/5+'%';b.style.top=r[1]/1.59+'%';b.style.width=r[2]/5+'%';b.style.height=r[3]/1.59+'%';b.innerHTML='<span class="key">'+b.dataset.key+'</span><span class="cooldown"></span><span class="flash"></span>'+(counts[i]?'<span class="count">'+counts[i]+'</span>':'');b.onclick=()=>activate(b);bar.appendChild(b);buttons.push(b)});function activate(b){if(!b||!b.dataset.key)return;b.classList.remove('active');void b.offsetWidth;b.classList.add('active');let c=b.querySelector('.cooldown');c.style.transition='none';c.style.height='100%';setTimeout(()=>{c.style.transition='height 2.4s linear';c.style.height='0'},25);let n=b.querySelector('.count');if(n&&+n.textContent>0)n.textContent=+n.textContent-1;setTimeout(()=>b.classList.remove('active'),300)}document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();toggleMode();return}if(e.key==='Backspace'){document.querySelectorAll('.count').forEach(c=>{let i=+c.closest('.slot').dataset.index;c.textContent=counts[i]||0});return}let k=e.key.length===1?e.key.toUpperCase():e.key;activate(buttons.find(x=>x.dataset.key.toUpperCase()===k))});debug.onclick=()=>buttons.forEach(b=>b.classList.toggle('debug'));let tool=false;function toggleMode(){tool=!tool;mode.textContent=tool?'Tool Hotbar':'Combat Hotbar'}modeBtn.onclick=toggleMode;</script></body></html>
