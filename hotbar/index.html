<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tales of Drak — Hotbar Step 2 Preview</title>
<style>
:root{
  --outer:#030304;--metal:#090a0c;--panel:#111216;--slot:#050608;--border:#3b3b3d;
  --hi:#8a8178;--silver:#b2a69c;--ivory:#e8ded0;--red:#b91520;--red2:#ff4b4b;
  --gold:#d6a34a;--empty:#707070;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eee;font-family:Georgia,'Times New Roman',serif}
.stage{height:100%;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(38px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 45%,#f8f8f7 0,#ededeb 58%,#dedbd7 100%)}
.hotbar-wrap{position:relative;width:min(96vw,1120px);aspect-ratio:1044/353;filter:drop-shadow(0 8px 9px rgba(0,0,0,.72));user-select:none;transform-origin:bottom center}
.main-frame{position:absolute;left:2.5%;right:2.5%;top:5%;height:55%;background:linear-gradient(#151313,#030303 42%,#080707 70%,#151111);border:4px solid #050505;box-shadow:inset 0 0 0 1px rgba(178,166,156,.28),inset 0 0 18px rgba(255,255,255,.035),0 0 0 1px rgba(60,48,44,.65)}
.main-frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(178,166,156,.24);box-shadow:inset 0 0 0 2px #030303;pointer-events:none}.main-frame:after{content:"";position:absolute;left:0;right:0;top:48%;height:13px;background:#020202;border-top:1px solid rgba(178,166,156,.22);border-bottom:1px solid rgba(185,45,35,.32);box-shadow:0 -2px 0 #111,0 2px 0 #000;pointer-events:none}
.corner{position:absolute;width:34px;height:34px;z-index:3}.corner:before,.corner:after{content:"";position:absolute;background:#090808;border:1px solid rgba(178,166,156,.46);box-shadow:0 0 0 2px #010101}.tl{left:-9px;top:-9px}.tr{right:-9px;top:-9px;transform:scaleX(-1)}.bl{left:-9px;bottom:-9px;transform:scaleY(-1)}.br{right:-9px;bottom:-9px;transform:scale(-1)}.corner:before{width:24px;height:10px;left:0;top:10px;transform:rotate(-42deg)}.corner:after{width:10px;height:24px;left:9px;top:0;transform:rotate(42deg)}
.grid{position:absolute;left:4.3%;right:4.3%;top:13.2%;height:40.6%;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:1fr 1fr;gap:9.5% .62%;z-index:2}
.slot{position:relative;background:linear-gradient(135deg,#171313,#050505 58%,#181313);border:3px solid #030303;box-shadow:inset 0 0 0 1px rgba(178,166,156,.35),inset 0 0 15px rgba(255,255,255,.04),0 0 0 1px rgba(66,60,54,.65);cursor:pointer;overflow:visible}.slot:before{content:"";position:absolute;inset:4px;border:1px solid rgba(185,171,153,.24);background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(0,0,0,.25));pointer-events:none}.slot:after{content:"";position:absolute;left:4px;right:4px;top:3px;height:1px;background:rgba(232,222,208,.28);pointer-events:none}
.key{position:absolute;left:0;right:0;top:-24px;height:20px;text-align:center;color:var(--ivory);font-size:17px;line-height:20px;text-shadow:0 2px 1px #000;letter-spacing:.04em}.icon{position:absolute;inset:8px 7px 6px;border:1px solid rgba(222,202,170,.18);background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.14),transparent 23%),linear-gradient(135deg,#230101,#78090b);overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.65)}
.icon:before{content:"";position:absolute;width:130%;height:7%;left:-18%;top:49%;background:currentColor;transform:rotate(42deg);box-shadow:0 0 12px currentColor}.icon:after{content:"";position:absolute;width:72%;height:5%;left:15%;top:45%;background:rgba(255,238,220,.70);transform:rotate(-44deg)}
.purple .icon{color:#9d31ff;background:linear-gradient(135deg,#170020,#4a0875)}.gray .icon{color:#aaa6a0;background:linear-gradient(135deg,#070707,#2b2926)}.gold .icon{color:#f5b950;background:linear-gradient(135deg,#201306,#523108)}.green .icon{color:#b7e866;background:linear-gradient(135deg,#0d1505,#263c0a)}.blue .icon{color:#56a4ff;background:linear-gradient(135deg,#031527,#0b3768)}.empty .icon{opacity:.35;filter:saturate(.2)}
.count{position:absolute;right:8px;bottom:4px;color:#f5ecdc;font:bold 16px Georgia,serif;text-shadow:0 2px 2px #000;z-index:4}.cooldown{position:absolute;left:7px;right:7px;bottom:6px;height:0;background:rgba(0,0,0,.68);z-index:3;pointer-events:none;transition:height linear}.slot.flash{animation:flash .24s ease-out}.slot.flash .icon{box-shadow:0 0 18px rgba(255,30,25,.95),inset 0 0 22px rgba(255,30,25,.30)}.slot.flash{border-color:#ff3326;box-shadow:0 0 18px rgba(255,35,26,.9),inset 0 0 18px rgba(255,34,26,.28)}@keyframes flash{0%{filter:brightness(1.9)}100%{filter:brightness(1)}}
.action-plate{position:absolute;left:10.5%;right:10.5%;top:60.5%;height:24%;background:linear-gradient(#111,#050505);clip-path:polygon(7% 0,93% 0,100% 30%,92% 76%,55% 76%,50% 100%,45% 76%,8% 76%,0 30%);box-shadow:inset 0 0 0 2px #2f2b27,inset 0 0 20px rgba(255,255,255,.025);color:var(--ivory);display:flex;justify-content:space-around;padding:4.4% 13% 0;text-align:center;font-size:15px;text-shadow:0 2px 1px #000;z-index:1}.action-plate:before{content:"";position:absolute;left:8%;right:8%;top:9px;border-top:1px solid rgba(178,166,156,.22);pointer-events:none}.section{min-width:130px}.pips{display:flex;gap:10px;justify-content:center;margin-top:10px}.pip{display:block;width:12px;height:12px;transform:rotate(45deg);background:var(--red);border:1px solid rgba(255,232,204,.65);box-shadow:0 0 7px rgba(255,30,30,.55)}.bonus .pip{background:#292929;box-shadow:none;border-color:#69645d}.move .pip{background:var(--gold);box-shadow:0 0 7px rgba(214,160,77,.55)}
.emblem{position:absolute;left:50%;top:56%;width:8.4%;height:33%;transform:translateX(-50%);clip-path:polygon(50% 0,86% 33%,63% 56%,50% 100%,37% 56%,14% 33%);background:linear-gradient(#181313,#050505);box-shadow:inset 0 0 0 2px #5e5345,0 0 10px #000;z-index:5}.emblem:before{content:"";position:absolute;left:48%;top:14%;width:5%;height:68%;background:#a89980;box-shadow:0 0 6px rgba(255,255,255,.25)}.emblem:after{content:"";position:absolute;left:31%;top:44%;width:38%;height:3%;background:#a89980}
.follow{position:absolute;right:-8.5%;top:64%;width:8%;height:16%;background:#080707;border:2px solid #3d3731;color:#e8dcc7;font-size:14px;text-align:right;padding:30px 7px 0 0;box-shadow:inset 0 0 0 1px rgba(178,166,156,.2)}.follow:before{content:"";position:absolute;left:13%;top:32%;width:36%;height:5%;background:#b7b2a8;transform:rotate(25deg);box-shadow:0 10px 0 #b7b2a8}.fkey{position:absolute;right:6px;top:7px;width:27px;height:23px;border:1px solid #5d554b;line-height:23px;text-align:center}.note{position:fixed;left:0;right:0;bottom:8px;text-align:center;font:13px Arial;color:#333;opacity:.65}.mode{position:absolute;left:37%;right:37%;top:76%;color:#d9cbb8;text-align:center;font-size:13px;text-shadow:0 2px 2px #000;z-index:8;opacity:.85}
@media(max-width:900px){.hotbar-wrap{width:1220px;max-width:none;transform:scale(.70)}}@media(max-width:700px){.hotbar-wrap{width:1220px;max-width:none;transform:scale(.47)}.stage{padding-bottom:calc(22px + env(safe-area-inset-bottom))}.note{display:none}}
</style>
</head>
<body>
<div class="stage"><div class="hotbar-wrap" id="hotbar"><div class="main-frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><div class="grid" id="grid"></div><div class="action-plate"><div class="section action">ACTION<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="section bonus">BONUS<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="section reaction">REACTION<div class="pips"><i class="pip"></i></div></div><div class="section move">MOVE<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div><div class="emblem"></div><div class="mode" id="mode">Combat Hotbar</div><div class="follow"><span class="fkey">F</span>Follow</div></div></div><div class="note">Static Step 2 preview. Click/press slots for temporary red flash + fake cooldown. Backspace resets pips.</div>
<script>
const topKeys=['1','2','3','4','5','6','7','8','9','0','-','=',''];
const bottomKeys=['Q','E','R','T','Y','U','I','O','P','[',']','-',''];
const colors=['red','gray','red','purple','red','red','red','purple','red','red','red','blue','gray','gray','gray','gold','purple','red','red','green','gold','gold','red','blue','gray','gray'];
const counts={'-top':12,'=':8,'P':3,'[':2};
const grid=document.getElementById('grid');
const mode=document.getElementById('mode');
let isTools=false;
function makeSlot(k,i,row){const s=document.createElement('button');s.className='slot '+colors[i]+(k?'':' empty');s.dataset.key=k;s.dataset.row=row;const key=document.createElement('b');key.className='key';key.textContent=k;s.appendChild(key);const icon=document.createElement('span');icon.className='icon';s.appendChild(icon);const cd=document.createElement('span');cd.className='cooldown';s.appendChild(cd);const countKey=(row==='top'&&k==='-')?'-top':k;if(counts[countKey]){const c=document.createElement('em');c.className='count';c.textContent=counts[countKey];s.appendChild(c)}s.addEventListener('click',()=>activate(s));grid.appendChild(s)}
topKeys.forEach((k,i)=>makeSlot(k,i,'top'));bottomKeys.forEach((k,i)=>makeSlot(k,i+13,'bottom'));
function activate(s){if(!s||!s.dataset.key)return;s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash');const cd=s.querySelector('.cooldown');cd.style.transition='none';cd.style.height='calc(100% - 14px)';setTimeout(()=>{cd.style.transition='height 2.4s linear';cd.style.height='0'},25);const count=s.querySelector('.count');if(count&&Number(count.textContent)>0)count.textContent=Number(count.textContent)-1}
document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();isTools=!isTools;mode.textContent=isTools?'Tool Hotbar':'Combat Hotbar';return}if(e.key==='Backspace'){document.querySelectorAll('.count').forEach(c=>{const p=c.closest('.slot');const k=p.dataset.key;c.textContent=(p.dataset.row==='top'&&k==='-')?12:(k==='='?8:(k==='P'?3:2));});return}const key=e.key.length===1?e.key.toUpperCase():e.key;const slot=[...document.querySelectorAll('.slot')].find(s=>s.dataset.key.toUpperCase()===key);activate(slot)});
</script>
</body>
</html>
