<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tales of Drak Hotbar Preview</title>
<style>
body{margin:0;background:#eee;height:100vh;display:flex;align-items:flex-end;justify-content:center;font-family:Georgia,serif}.hud{margin-bottom:40px}.frame{background:#070606;border:2px solid #4a4037;padding:24px 18px 16px}.grid{display:grid;grid-template-columns:repeat(12,58px);gap:5px}.slot{width:58px;height:58px;background:#120f0f;border:2px solid #4b4036;position:relative}.slot b{position:absolute;top:-24px;left:0;right:0;text-align:center;color:#eadfca;font-size:17px}.slot span{position:absolute;inset:8px;background:linear-gradient(135deg,#210101,#84090b);border:1px solid #6a5b4b}.slot:nth-child(4n) span{background:linear-gradient(135deg,#150020,#4c0872)}.slot:nth-child(7n) span{background:linear-gradient(135deg,#06152a,#14508a)}.slot.selected{border-color:#ff2418;box-shadow:0 0 16px #ff2418}.bar{height:70px;background:#080707;color:#eadfca;display:flex;gap:55px;justify-content:center;align-items:flex-start;padding-top:14px}.d{display:flex;gap:9px;justify-content:center;margin-top:10px}.d i{display:block;width:10px;height:10px;background:#b10f13;transform:rotate(45deg);border:1px solid #d8c8aa}.move i{background:#d7a450}.emblem{position:absolute;left:50%;bottom:24px;width:62px;height:76px;background:#0b0909;transform:translateX(-50%);clip-path:polygon(50% 0,85% 35%,50% 100%,15% 35%);box-shadow:inset 0 0 0 2px #5a5045}.wrap{position:relative}.note{position:fixed;bottom:8px;left:0;right:0;text-align:center;font:14px Arial;color:#333}
</style>
</head>
<body>
<div class="wrap"><div class="hud"><div class="frame"><div class="grid">
<div class="slot"><b>1</b><span></span></div><div class="slot"><b>2</b><span></span></div><div class="slot"><b>3</b><span></span></div><div class="slot"><b>4</b><span></span></div><div class="slot selected"><b>5</b><span></span></div><div class="slot"><b>6</b><span></span></div><div class="slot"><b>7</b><span></span></div><div class="slot"><b>8</b><span></span></div><div class="slot"><b>9</b><span></span></div><div class="slot"><b>0</b><span></span></div><div class="slot"><b>-</b><span></span></div><div class="slot"><b>=</b><span></span></div>
<div class="slot"><b>Q</b><span></span></div><div class="slot"><b>E</b><span></span></div><div class="slot"><b>R</b><span></span></div><div class="slot"><b>T</b><span></span></div><div class="slot"><b>Y</b><span></span></div><div class="slot"><b>U</b><span></span></div><div class="slot"><b>I</b><span></span></div><div class="slot"><b>O</b><span></span></div><div class="slot"><b>P</b><span></span></div><div class="slot"><b>[</b><span></span></div><div class="slot"><b>]</b><span></span></div><div class="slot"><b>-</b><span></span></div>
</div></div><div class="bar"><div>ACTION<div class="d"><i></i><i></i><i></i><i></i></div></div><div>BONUS<div class="d"><i></i><i></i><i></i><i></i></div></div><div>REACTION<div class="d"><i></i></div></div><div class="move">MOVE<div class="d"><i></i><i></i><i></i></div></div></div></div><div class="emblem"></div></div><div class="note">Static web review page. The real clickable Godot version is in standalone/hotbar_prototype.</div>
</body>
</html>
