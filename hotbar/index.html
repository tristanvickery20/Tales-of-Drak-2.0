<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tales of Drak Hotbar Preview</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f2f2f0;font-family:Georgia,serif}.stage{height:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 18px 46px;box-sizing:border-box}.hud{position:relative;width:1038px;max-width:100%;transform-origin:bottom center;filter:drop-shadow(0 7px 8px rgba(0,0,0,.55))}.main{position:relative;background:linear-gradient(#161313,#050505 55%,#141111);border:2px solid #2f2b27;padding:22px 17px 12px;box-shadow:inset 0 0 0 1px #080707,inset 0 0 20px rgba(255,255,255,.04)}.main:before{content:"";position:absolute;inset:5px;border:1px solid rgba(145,130,105,.24);pointer-events:none}.main:after{content:"";position:absolute;inset:-6px;border:1px solid #090807;pointer-events:none}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.slot{height:56px;position:relative;background:linear-gradient(135deg,#171313,#050505 58%,#171313);border:2px solid #3d3731;box-shadow:inset 0 0 0 1px #090808,inset 0 0 16px rgba(255,255,255,.035)}.key{position:absolute;top:-22px;left:0;right:0;text-align:center;color:#e8dcc7;font-size:16px;text-shadow:0 2px 2px #000}.icon{position:absolute;inset:7px;border:1px solid rgba(220,200,170,.18);overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.14),transparent 22%),linear-gradient(135deg,#240101,#72080a);color:#f21b18}.icon:before{content:"";position:absolute;width:56px;height:4px;left:-8px;top:22px;background:currentColor;transform:rotate(42deg);box-shadow:0 0 11px currentColor}.icon:after{content:"";position:absolute;width:34px;height:3px;left:7px;top:19px;background:rgba(255,240,220,.72);transform:rotate(-44deg)}.purple .icon{color:#9b31ff;background:linear-gradient(135deg,#16001f,#4b0875)}.gray .icon{color:#aaa6a0;background:linear-gradient(135deg,#080808,#2a2926)}.gold .icon{color:#f5b950;background:linear-gradient(135deg,#201306,#523108)}.green .icon{color:#b7e866;background:linear-gradient(135deg,#0d1505,#263c0a)}.blue .icon{color:#56a4ff;background:linear-gradient(135deg,#031527,#0b3768)}.selected{border-color:#ff3326;box-shadow:0 0 18px rgba(255,35,26,.9),inset 0 0 18px rgba(255,34,26,.28)}.selected:before{content:"";position:absolute;inset:-5px;background:rgba(255,35,26,.2);box-shadow:0 0 16px #ff2418;pointer-events:none}.count{position:absolute;right:6px;bottom:2px;color:#f5ecdc;font:bold 15px Arial;text-shadow:0 2px 2px #000;z-index:5}.bar{position:relative;width:780px;height:70px;margin:-1px auto 0;background:linear-gradient(#111,#050505);clip-path:polygon(7% 0,93% 0,100% 30%,92% 76%,55% 76%,50% 100%,45% 76%,8% 76%,0 30%);box-shadow:inset 0 0 0 2px #2f2b27;color:#e8dcc7;display:flex;justify-content:space-around;padding:15px 80px 0;box-sizing:border-box;text-align:center;font-size:14px}.d{display:flex;gap:9px;justify-content:center;margin-top:12px}.d i{display:block;width:10px;height:10px;transform:rotate(45deg);background:#b81217;border:1px solid rgba(255,232,204,.55);box-shadow:0 0 7px rgba(255,30,30,.5)}.bonus i{background:#292929;box-shadow:none;border-color:#69645d}.move i{background:#d6a04d;box-shadow:0 0 7px rgba(214,160,77,.5)}.emblem{position:absolute;left:50%;bottom:-15px;width:74px;height:88px;transform:translateX(-50%);clip-path:polygon(50% 0,86% 34%,50% 100%,14% 34%);background:linear-gradient(#181313,#050505);box-shadow:inset 0 0 0 2px #5e5345,0 0 10px #000}.emblem:before{content:"";position:absolute;left:35px;top:13px;width:4px;height:61px;background:#a89980;box-shadow:0 0 6px rgba(255,255,255,.25)}.emblem:after{content:"";position:absolute;left:23px;top:42px;width:28px;height:3px;background:#a89980}.follow{position:absolute;right:-94px;bottom:12px;width:82px;height:46px;background:#080707;border:2px solid #3d3731;color:#e8dcc7;font-size:12px;text-align:right;box-sizing:border-box;padding:25px 5px 0 0}.follow:before{content:"";position:absolute;left:12px;top:14px;width:28px;height:3px;background:#b7b2a8;transform:rotate(25deg);box-shadow:0 9px 0 #b7b2a8}.fkey{position:absolute;right:5px;top:7px;width:25px;height:21px;border:1px solid #5d554b;line-height:21px;text-align:center}.corner{position:absolute;width:18px;height:18px;border-color:#756957}.tl{left:-7px;top:-7px;border-left:3px solid;border-top:3px solid}.tr{right:-7px;top:-7px;border-right:3px solid;border-top:3px solid}.bl{left:-7px;bottom:-7px;border-left:3px solid;border-bottom:3px solid}.br{right:-7px;bottom:-7px;border-right:3px solid;border-bottom:3px solid}.note{position:fixed;left:0;right:0;bottom:8px;text-align:center;font:13px Arial;color:#333;opacity:.65}@media(max-width:900px){.hud{transform:scale(.74);max-width:none}}@media(max-width:700px){.hud{transform:scale(.48);max-width:none}.stage{padding-bottom:36px}}
</style></head><body><div class="stage"><div class="hud"><div class="main"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="grid">
