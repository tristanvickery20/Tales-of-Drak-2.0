<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tales of Drak — Fixed Hotbar Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f8f7f3;font-family:Georgia,'Times New Roman',serif}.base{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;z-index:2;pointer-events:none}.bar{position:relative;width:min(98vw,1500px);aspect-ratio:2155/730;pointer-events:none}.slot{position:absolute;border:0;background:transparent;padding:0;margin:0;overflow:visible;pointer-events:auto;-webkit-tap-highlight-color:transparent}.slot.debug{background:rgba(255,0,0,.14);outline:1px solid rgba(255,0,0,.65)}.flash{position:absolute;inset:-8%;border:2px solid rgba(255,76,76,.98);box-shadow:0 0 10px rgba(255,48,48,.95),0 0 22px rgba(255,10,10,.55),inset 0 0 10px rgba(255,55,55,.45);opacity:0;pointer-events:none}.slot.active .flash{animation:flash .26s ease-out forwards}@keyframes flash{0%{opacity:1;filter:brightness(1.7)}100%{opacity:0;filter:brightness(1)}}.cooldown{position:absolute;left:3%;right:3%;bottom:2%;height:0;background:rgba(0,0,0,.68);box-shadow:inset 0 0 14px rgba(0,0,0,.9);transition:height 2.4s linear;pointer-events:none}.key{position:absolute;left:0;right:0;top:-22%;height:20%;text-align:center;color:#e8ded0;font-size:clamp(9px,1.18vw,19px);line-height:1;text-shadow:0 2px 2px #000,0 0 6px #000;letter-spacing:.04em;pointer-events:none}.count{position:absolute;right:4%;bottom:2%;color:#f4edde;font:bold clamp(8px,1.1vw,18px) Georgia,'Times New Roman',serif;text-shadow:0 2px 2px #000,0 0 5px #000;pointer-events:none}.econ{position:absolute;z-index:7;color:#e8ded0;text-align:center;text-shadow:0 2px 2px #000,0 0 6px #000;letter-spacing:.035em;font-size:clamp(8px,1.05vw,17px);line-height:1;pointer-events:none}.econ.action{left:12.8%;top:75.4%;width:12%}.econ.bonus{left:31.4%;top:75.4%;width:12%}.econ.reaction{left:58.0%;top:75.4%;width:14%}.econ.move{left:74.5%;top:75.4%;width:11%}.pips{position:absolute;left:0;right:0;top:122%;display:flex;gap:clamp(3px,.55vw,9px);justify-content:center}.pip{width:clamp(5px,.72vw,12px);height:clamp(5px,.72vw,12px);transform:rotate(45deg);border:1px solid rgba(255,232,206,.85);box-shadow:0 0 6px rgba(255,30,30,.55);background:#b91520}.bonus .pip{background:#333;box-shadow:none;border-color:#777}.move .pip{background:#d6a34a;box-shadow:0 0 6px rgba(214,163,74,.62)}.follow{position:absolute;left:101%;top:63.8%;width:8.6%;height:18%;background:linear-gradient(#111,#030303);border:2px solid #080808;box-shadow:inset 0 0 0 1px rgba(178,166,156,.38),0 0 8px rgba(0,0,0,.7);color:#e8ded0;text-shadow:0 2px 2px #000;font-size:clamp(7px,.9vw,14px);text-align:center;padding-top:10.5%;pointer-events:auto}.follow:before,.follow:after{content:"";position:absolute;left:13%;top:32%;width:32%;height:5%;background:#c4bbb0;transform:rotate(27deg);box-shadow:0 0 5px rgba(255,255,255,.3)}.follow:after{top:51%}.fkey{position:absolute;right:7%;top:14%;width:24%;height:38%;border:1px solid rgba(232,222,208,.6);line-height:1.45;background:#060606}.tools{position:fixed;top:10px;left:10px;z-index:5;display:flex;gap:8px}.tools button{background:rgba(10,10,10,.8);color:#fff;border:1px solid #444;border-radius:6px;padding:8px 10px;font:12px system-ui}.mode{position:absolute;left:42%;right:42%;top:88%;z-index:8;color:#d9cbb8;text-align:center;text-shadow:0 2px 2px #000;font-size:clamp(7px,.8vw,13px);pointer-events:none}@media(max-width:700px){.stage{align-items:flex-end;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.bar{width:155vw;max-width:none}.tools{display:none}.follow{display:none}.key{font-size:12px}.count{font-size:12px}.econ{font-size:10px}}
</style>
</head>
<body>
<iframe class="base" src="./index.html?v=base-shell-c3b162b" aria-hidden="true"></iframe>
<div class="stage"><div id="bar" class="bar"><div id="mode" class="mode">Combat Hotbar</div><div class="econ action">ACTION<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="econ bonus">BONUS<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="econ reaction">REACTION<div class="pips"><i class="pip"></i></div></div><div class="econ move">MOVE<div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div><div class="follow"><span class="fkey">F</span>Follow</div></div></div>
<div class="tools"><button id="debug">Debug hitboxes</button><button id="modeBtn">Toggle Tool/Combat</button></div>
<script>
const topKeys=['1','2','3','4','5','6','7','8','9','0','-','=',''];
const bottomKeys=['Q','E','R','T','Y','U','I','O','P','[',']','-',''];
const slots=[[4.501,22.877,5.708,17.397],[11.276,22.877,5.94,17.397],[18.283,22.877,5.94,17.397],[25.336,22.877,5.94,17.397],[32.343,22.877,6.125,17.397],[39.582,22.74,5.986,17.534],[46.682,22.877,5.986,17.397],[53.782,22.877,5.893,17.397],[60.789,22.877,5.94,17.397],[67.889,22.877,6.032,17.397],[75.081,22.877,5.986,17.397],[81.995,22.877,5.429,17.397],[88.492,22.877,4.965,17.397],[4.501,49.726,5.708,16.986],[11.276,49.726,5.94,16.986],[18.283,49.726,5.94,16.986],[25.336,49.726,5.94,16.986],[32.343,49.726,6.125,16.986],[39.582,49.726,5.986,16.986],[46.682,49.726,5.986,16.986],[53.782,49.726,5.893,16.986],[60.789,49.726,5.94,16.986],[67.889,49.726,6.032,16.986],[75.081,49.726,5.986,16.986],[81.995,49.726,5.429,16.986],[88.492,49.726,4.965,16.986]];
const counts={10:12,11:8,22:3,23:2};
const bar=document.getElementById('bar');
const buttons=[];
slots.forEach((d,i)=>{const b=document.createElement('button');b.className='slot';b.dataset.index=i;b.dataset.key=i<13?topKeys[i]:bottomKeys[i-13];b.style.left=d[0]+'%';b.style.top=d[1]+'%';b.style.width=d[2]+'%';b.style.height=d[3]+'%';b.innerHTML='<span class="key">'+b.dataset.key+'</span><span class="cooldown"></span><span class="flash"></span>'+(counts[i]?'<span class="count">'+counts[i]+'</span>':'');b.addEventListener('click',()=>activate(b));bar.appendChild(b);buttons.push(b)});
function activate(b){if(!b||!b.dataset.key)return;b.classList.remove('active');void b.offsetWidth;b.classList.add('active');const c=b.querySelector('.cooldown');c.style.transition='none';c.style.height='100%';setTimeout(()=>{c.style.transition='height 2.4s linear';c.style.height='0'},25);const count=b.querySelector('.count');if(count&&Number(count.textContent)>0)count.textContent=Number(count.textContent)-1;setTimeout(()=>b.classList.remove('active'),300)}
document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();toggleMode();return}if(e.key==='Backspace'){document.querySelectorAll('.count').forEach(c=>{const i=Number(c.closest('.slot').dataset.index);c.textContent=counts[i]||0});return}const key=e.key.length===1?e.key.toUpperCase():e.key;const b=buttons.find(x=>x.dataset.key.toUpperCase()===key);activate(b)});
document.getElementById('debug').onclick=()=>buttons.forEach(b=>b.classList.toggle('debug'));
let tools=false;function toggleMode(){tools=!tools;document.getElementById('mode').textContent=tools?'Tool Hotbar':'Combat Hotbar'}document.getElementById('modeBtn').onclick=toggleMode;
</script>
</body>
</html>
